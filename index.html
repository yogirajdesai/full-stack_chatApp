<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            padding: 40px 20px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );
        }

        .container {

            width: 100%;

            max-width: 850px;

            margin: auto;

            background: rgba(255,255,255,0.97);

            padding: 40px;

            border-radius: 25px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.25);
        }

        .header {

            text-align: center;

            margin-bottom: 35px;
        }

        .icon {

            width: 80px;

            height: 80px;

            margin: auto;

            margin-bottom: 15px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 38px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            box-shadow:
                0 10px 25px
                rgba(102,126,234,0.4);
        }

        h1 {

            color: #1e293b;

            margin-bottom: 10px;

            font-size: 32px;
        }

        .header p {

            color: #64748b;

            font-size: 15px;
        }

        .section-title {

            margin-top: 30px;

            margin-bottom: 20px;

            padding-bottom: 10px;

            border-bottom:
                2px solid #e2e8f0;

            color: #4f46e5;

            font-size: 18px;

            font-weight: bold;
        }

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .form-group {

            margin-bottom: 5px;
        }

        .full {

            grid-column: 1 / -1;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-weight: bold;

            font-size: 14px;
        }

        input,
        select,
        textarea {

            width: 100%;

            padding: 14px;

            border:
                1px solid #cbd5e1;

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            background: #f8fafc;

            transition: 0.3s;
        }

        textarea {

            min-height: 100px;

            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {

            background: white;

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px
                rgba(99,102,241,0.12);
        }

        button {

            width: 100%;

            margin-top: 30px;

            padding: 16px;

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            transition: 0.3s;

            box-shadow:
                0 10px 25px
                rgba(102,126,234,0.35);
        }

        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 15px 30px
                rgba(102,126,234,0.45);
        }

        .view-users {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #4f46e5;

            text-decoration: none;

            font-weight: bold;
        }

        .footer {

            text-align: center;

            margin-top: 30px;

            color: #94a3b8;

            font-size: 12px;
        }

        @media(max-width: 650px) {

            .container {

                padding: 25px;
            }

            .form-grid {

                grid-template-columns: 1fr;
            }

            .full {

                grid-column: auto;
            }

            h1 {

                font-size: 26px;
            }
        }

    </style>

</head>


<body>

<div class="container">


    <div class="header">

        <div class="icon">
            🎓
        </div>

        <h1>
            Student Registration
        </h1>

        <p>
            Complete the form to register as a student
        </p>

    </div>


    <form action="/register"
          method="POST">


        <div class="section-title">
            👤 Personal Information
        </div>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Student Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter full name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="10-digit phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Gender
                </label>

                <select name="gender"
                        required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Date of Birth
                </label>

                <input
                    type="date"
                    name="dob"
                    required>

            </div>

        </div>


        <div class="section-title">
            🎓 Education Information
        </div>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Course
                </label>

                <select name="course"
                        required>

                    <option value="">
                        Select Course
                    </option>

                    <option value="B.Tech">
                        B.Tech
                    </option>

                    <option value="M.Tech">
                        M.Tech
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="MCA">
                        MCA
                    </option>

                    <option value="Diploma">
                        Diploma
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    College / Institute
                </label>

                <input
                    type="text"
                    name="college"
                    placeholder="Enter college name"
                    required>

            </div>

        </div>


        <div class="section-title">
            📍 Address Information
        </div>


        <div class="form-grid">


            <div class="form-group full">

                <label>
                    Full Address
                </label>

                <textarea
                    name="address"
                    placeholder="Enter your complete address"
                    required></textarea>

            </div>


            <div class="form-group">

                <label>
                    City
                </label>

                <input
                    type="text"
                    name="city"
                    placeholder="Enter city"
                    required>

            </div>


            <div class="form-group">

                <label>
                    State
                </label>

                <input
                    type="text"
                    name="state"
                    placeholder="Enter state"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Pincode
                </label>

                <input
                    type="text"
                    name="pincode"
                    placeholder="6-digit pincode"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    required>

            </div>

        </div>


        <button type="submit">

            🚀 Register Student

        </button>


    </form>


    <a href="/users"
       class="view-users">

        📋 View Registered Students

    </a>


    <div class="footer">

        © 2026 Student Registration System

    </div>

</div>

</body>

</html>
